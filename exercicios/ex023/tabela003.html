<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px solid black
            ;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de Cédulas</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td> <!--COLspan pra mesclar na linha (apesar de ser en duas ou mais colunas)-->
        </tr>
         <tr>
            <td rowspan="3">D</td> <!--ROWspan pra mesclar na coluna (apesar de ser em duas ou mais linhas)-->
            <td>E</td>
            <td>F</td>
        </tr>
         <tr>
            <td>H</td>
            <td>I</td>
        </tr>
         <tr>
            <td>K</td>
            <td>L</td>
        </tr>
    </table>
</body>
</html>
